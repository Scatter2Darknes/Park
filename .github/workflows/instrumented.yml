# Instrumented tests (the Room migration tests) on a throw-away emulator. Manual only, because it is slow: open the
# repository's Actions tab, choose "Instrumented tests", and press "Run workflow".
#
# Running connectedDebugAndroidTest here is safe because this emulator is created for the job and discarded afterwards.
# NEVER run it against a physical phone: it uninstalls the app when it finishes, wiping the app's data (see the safety
# rules in scripts/README.md). That is why nothing under scripts/ is allowed to run it.

name: Instrumented tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instrumented:
    name: Room migration tests on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      # The emulator needs hardware acceleration (KVM), which is off by default on the runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: ./gradlew connectedDebugAndroidTest --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: app/build/reports/androidTests/
          retention-days: 7
