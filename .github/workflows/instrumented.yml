# Instrumented tests (the Room migration tests) on a throw-away emulator. Manual only, because it is slow: open the
# repository's Actions tab, choose "Instrumented tests", and press "Run workflow".
#
# Running connectedDebugAndroidTest here is safe because this emulator is created for the job and discarded afterwards.
# NEVER run it against a physical phone: it uninstalls the app when it finishes, wiping the app's data (see the safety
# rules in scripts/README.md). That is why nothing under scripts/ is allowed to run it.

name: Instrumented tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instrumented:
    name: Room migration tests on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # GitHub's Ubuntu runners already have an Android SDK (ANDROID_HOME=/usr/local/lib/android/sdk, with sdkmanager
      # under cmdline-tools/latest/bin), so nothing is downloaded to set one up. android-actions/setup-android@v3 was
      # removed because it tries to install the legacy "tools" package and fails ("Failed to find package 'tools'").
      # This step only makes sure the two packages this project needs are there. Keep them in step with the project:
      #   platform     = compileSdk in app/build.gradle.kts (release(37) is the package "platforms;android-37.0")
      #   build tools  = the version Android Gradle Plugin 9.4.0 uses by default (the project doesn't pin one)
      # (scripts/tests/test_ci_workflow.py checks the platform against compileSdk.)
      - name: Set up Android SDK
        env:
          ANDROID_PLATFORM: "platforms;android-37.0"
          ANDROID_BUILD_TOOLS: "build-tools;36.0.0"
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK root: $sdk_root"
          env | sort | grep -i '^ANDROID' || true
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            echo "::error::No sdkmanager at $sdkmanager"
            ls -la "$sdk_root" "$sdk_root/cmdline-tools" || true
            exit 1
          fi
          # Answers "y" to every licence prompt without a pipe, so `yes` being closed early can't fail the step.
          "$sdkmanager" --sdk_root="$sdk_root" --licenses < <(yes) > /dev/null
          "$sdkmanager" --sdk_root="$sdk_root" --install "$ANDROID_PLATFORM" "$ANDROID_BUILD_TOOLS"
          "$sdkmanager" --sdk_root="$sdk_root" --list_installed

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      # The emulator needs hardware acceleration (KVM), which is off by default on the runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: ./gradlew connectedDebugAndroidTest --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: app/build/reports/androidTests/
          retention-days: 7
